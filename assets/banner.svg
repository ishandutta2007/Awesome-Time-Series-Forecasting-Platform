<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .grid-line { stroke: #334155; stroke-dasharray: 4 4; opacity: 0.3; }
      .wave {
        fill: none;
        stroke: url(#text-grad);
        stroke-width: 3.5;
        stroke-linecap: round;
        filter: url(#glow);
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: draw 6s ease-in-out infinite alternate;
      }
      .pulse-dot {
        fill: #38bdf8;
        filter: url(#glow);
        animation: pulse 2s ease-in-out infinite alternate;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#text-grad);
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-bg { fill: #1e293b; stroke: #38bdf8; stroke-opacity: 0.4; rx: 6px; }
      .tag-text { font-family: monospace; font-size: 13px; fill: #38bdf8; }

      @keyframes draw {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.5); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/>

  <!-- Subtle Grid Lines representing charts -->
  <line x1="100" y1="60" x2="1100" y2="60" class="grid-line"/>
  <line x1="100" y1="120" x2="1100" y2="120" class="grid-line"/>
  <line x1="100" y1="180" x2="1100" y2="180" class="grid-line"/>
  <line x1="100" y1="240" x2="1100" y2="240" class="grid-line"/>

  <line x1="200" y1="40" x2="200" y2="280" class="grid-line"/>
  <line x1="400" y1="40" x2="400" y2="280" class="grid-line"/>
  <line x1="600" y1="40" x2="600" y2="280" class="grid-line"/>
  <line x1="800" y1="40" x2="800" y2="280" class="grid-line"/>
  <line x1="1000" y1="40" x2="1000" y2="280" class="grid-line"/>

  <!-- Dynamic Time-Series Wave (Background Graph element) -->
  <path class="wave" d="M 80,230 Q 180,260 280,190 T 480,220 T 680,140 T 880,180 T 1080,80 T 1140,110" />

  <!-- Accent glow point at end of trend -->
  <circle cx="1080" cy="80" r="6" class="pulse-dot"/>

  <!-- Content Container (Foregrounded Text & Badges) -->
  <g transform="translate(80, 85)">
    <!-- Title -->
    <text x="0" y="45" class="title-text">Awesome Time-Series Forecasting Platform 📈</text>
    
    <!-- Subtitle -->
    <text x="0" y="85" class="subtitle-text">A Curated Ecosystem of Enterprise SaaS Platforms, AutoML Tools &amp; Open-Source Libraries</text>

    <!-- Pill Tags -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="160" height="30" class="tag-bg"/>
      <text x="14" y="20" class="tag-text">⚡ Statistical Baselines</text>

      <rect x="175" y="0" width="165" height="30" class="tag-bg"/>
      <text x="189" y="20" class="tag-text">🧠 Deep Learning &amp; AI</text>

      <rect x="355" y="0" width="160" height="30" class="tag-bg"/>
      <text x="369" y="20" class="tag-text">🔮 Foundation Models</text>

      <rect x="530" y="0" width="165" height="30" class="tag-bg"/>
      <text x="544" y="20" class="tag-text">📊 Enterprise AutoML</text>
    </g>
  </g>
</svg>
